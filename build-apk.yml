name: Build Local Dream FaceSwap APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local Dream v3.0.0-alpha.3
        uses: actions/checkout@v4
        with:
          repository: xororz/local-dream
          ref: v3.0.0-alpha.3
          path: local-dream
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "platform-tools"

      - name: Add FaceSwap files and patch
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p local-dream/app/src/main/java/io/github/xororz/localdream/faceswap
          mkdir -p local-dream/app/src/main/java/io/github/xororz/localdream/ui/screens
          echo '' | base64 -d > local-dream/app/src/main/java/io/github/xororz/localdream/faceswap/FaceSwapEngine.kt
          echo '' | base64 -d > local-dream/app/src/main/java/io/github/xororz/localdream/ui/screens/FaceSwapScreen.kt
          echo '' | base64 -d > /tmp/faceswap.patch
          cd local-dream
          git apply /tmp/faceswap.patch

      - name: Create temporary signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/local-dream/faceswap-release.jks" \
            -storepass localdream \
            -keypass localdream \
            -alias localdream \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=LocalDream FaceSwap,O=Local Build,C=US"
          cat >> "$GITHUB_WORKSPACE/local-dream/gradle.properties" <<'EOF'
          RELEASE_STORE_FILE=faceswap-release.jks
          RELEASE_STORE_PASSWORD=localdream
          RELEASE_KEY_ALIAS=localdream
          RELEASE_KEY_PASSWORD=localdream
          EOF

      - name: Build APK
        working-directory: local-dream
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleBasicDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          APK="$(find local-dream/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" out/LocalDream_FaceSwap_3.0.0-alpha.3.apk
          test -s out/LocalDream_FaceSwap_3.0.0-alpha.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalDream-FaceSwap-APK
          path: out/LocalDream_FaceSwap_3.0.0-alpha.3.apk
          if-no-files-found: error
