      - name: Make it a separate app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          g = Path("local-dream/app/build.gradle.kts")
          s = g.read_text()
          a = '        debug {\n            signingConfig = signingConfigs.getByName("release")\n'
          if "applicationIdSuffix" not in s:
              if s.count(a) != 1:
                  raise SystemExit("debug block not found")
              s = s.replace(a, a + '            applicationIdSuffix = ".faceswap"\n', 1)
              g.write_text(s)
          n = 0
          for f in Path("local-dream/app/src/main/res").glob("values*/strings.xml"):
              t = f.read_text()
              old = '<string name="app_name">Local Dream</string>'
              if old in t:
                  f.write_text(t.replace(old, '<string name="app_name">Local Dream FaceSwap</string>'))
                  n += 1
          if n == 0:
              raise SystemExit("app_name not found")
          print(f"App ID suffix added, {n} app names changed.")
          PY

      - name: Copy native engine from official APK
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/o.apk "$OFFICIAL_APK_URL"
          echo "$OFFICIAL_APK_SHA256  /tmp/o.apk" | sha256sum -c -
          unzip -q /tmp/o.apk 'lib/arm64-v8a/*' 'assets/qnnlibs/*' 'assets/ditlibs/*' 'assets/licenses/*' -d /tmp/o
          M=local-dream/app/src/main
          mkdir -p "$M/jniLibs/arm64-v8a" "$M/assets"
          cp /tmp/o/lib/arm64-v8a/libstable_diffusion_core.so /tmp/o/lib/arm64-v8a/libdit_engine.so "$M/jniLibs/arm64-v8a/"
          cp -r /tmp/o/assets/qnnlibs /tmp/o/assets/ditlibs /tmp/o/assets/licenses "$M/assets/"

      - name: Build APK
        working-directory: local-dream
        run: |
          set -euo pipefail
          test -s app/faceswap-release.jks
          chmod +x gradlew
          build() {
            ./gradlew :app:assembleBasicDebug --no-daemon --stacktrace \
              -PRELEASE_STORE_FILE=faceswap-release.jks -PRELEASE_STORE_PASSWORD=localdream \
              -PRELEASE_KEY_ALIAS=localdream -PRELEASE_KEY_PASSWORD=localdream 2>&1 | tee /tmp/g.log
            return "${PIPESTATUS[0]}"
          }
          build && exit 0
          P="$ANDROID_HOME/platforms"
          if grep -q "android-37" /tmp/g.log && [ -d "$P/android-37.0" ] && [ ! -e "$P/android-37" ]; then
            echo "Retrying with android-37 alias"
            cp -r "$P/android-37.0" "$P/android-37"
            sed -i 's#platforms;android-37.0#platforms;android-37#' "$P/android-37/package.xml"
            build
          else
            exit 1
          fi

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FaceSwap-build-diagnostics
          path: |
            /tmp/g.log
            local-dream/app/src/main/java/io/github/xororz/localdream/faceswap/FaceSwapEngine.kt
            local-dream/app/src/main/java/io/github/xororz/localdream/ui/screens/FaceSwapScreen.kt
            local-dream/app/build.gradle.kts
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$(find local-dream/app/build/outputs/apk/basic/debug -name '*.apk' -print -quit)"
          mkdir -p out && cp "$APK" "out/$OUT_APK"
          unzip -l "out/$OUT_APK" > /tmp/a.txt
          for f in lib/arm64-v8a/libstable_diffusion_core.so lib/arm64-v8a/libdit_engine.so \
                   assets/qnnlibs/libQnnHtp.so assets/qnnlibs/libQnnSystem.so \
                   assets/ditlibs/libggml-htp-v79.so assets/licenses/qnn-2.50.0.260828/SHA256SUMS \
                   assets/faceswap/emap.bin lib/arm64-v8a/libonnxruntime.so; do
            grep -q " $f\$" /tmp/a.txt || { echo "Missing: $f"; exit 1; }
          done
          unzip -p "out/$OUT_APK" 'classes*.dex' > /tmp/dex.bin
          grep -aq FaceSwapScreen /tmp/dex.bin
          grep -aq HyperSwap /tmp/dex.bin
          grep -aq AlphaFace /tmp/dex.bin
          grep -aq XNNPACK /tmp/dex.bin || true
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)"
          "$SIGNER" verify "out/$OUT_APK"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n1)"
          "$AAPT2" dump packagename "out/$OUT_APK" | tee /tmp/pkg.txt
          grep -qx 'io.github.xororz.localdream.faceswap' /tmp/pkg.txt
          sha256sum "out/$OUT_APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalDream-FaceSwap-Pro-v2-APK
          path: out/${{ env.OUT_APK }}
          if-no-files-found: error
          retention-days: 7
