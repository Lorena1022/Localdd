                                  val installed = when (model) {
                                      EnhancerModel.OFF -> true
                                      EnhancerModel.GPEN -> FaceSwapModels.has(context, FaceSwapModels.GPEN)
                                      EnhancerModel.GFPGAN -> FaceSwapModels.has(context, FaceSwapModels.GFPGAN)
                                  }
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .clickable(enabled = installed && !running) { enhancer = model },
                                      verticalAlignment = Alignment.CenterVertically,
                                  ) {
                                      RadioButton(selected = enhancer == model, onClick = { if (installed && !running) enhancer = model }, enabled = installed && !running)
                                      Text(model.label)
                                  }
                              }
                              if (enhancer != EnhancerModel.OFF) {
                                  Text("Enhancer strength: ${(enhance * 100).toInt()}%")
                                  Slider(value = enhance, onValueChange = { enhance = it }, valueRange = 0f..1f, enabled = !running)
                              }
                          }
                      }
          
                      Card(modifier = Modifier.fillMaxWidth()) {
                          Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Text("Quality controls", style = MaterialTheme.typography.titleMedium)
                              SettingSwitch("Precise face-region mask", "BiSeNet preserves eyes, glasses, lips and facial boundaries.", preciseMask, !running) { preciseMask = it }
                              SettingSwitch("Occlusion protection", "XSeg helps keep hair, hands and objects that pass in front of the face.", occlusionMask, !running) { occlusionMask = it }
                              SettingSwitch("Skin-tone color match", "Gently matches the swapped face to the surrounding target skin and lighting.", colorMatch, !running) { colorMatch = it }
                              SettingSwitch("512 px Pixel Boost", "Processes 256 px swap models in higher-detail tiles. Better detail, slower processing.", pixelBoost, !running) { pixelBoost = it }
                          }
                      }
          
                      Column {
                          Text("Identity / blend strength: ${(strength * 100).toInt()}%")
                          Slider(value = strength, onValueChange = { strength = it }, valueRange = 0.45f..1f, enabled = !running)
                      }
          
                      errorMessage?.let { Text(it, color = MaterialTheme.colorScheme.error) }
          
                      Button(
                          onClick = {
                              val srcs = sourceUris
                              if (srcs.isEmpty()) return@Button
                              if (targetUri == null && transferredTarget == null) return@Button
                              running = true
                              errorMessage = null
                              scope.launch {
                                  try {
                                      val output = withContext(Dispatchers.Default) {
                                          val target = targetUri?.let { FaceSwapEngine.decodeBitmap(context, it) }
                                              ?: transferredTarget!!.copy(Bitmap.Config.ARGB_8888, true)
                                          try {
                                              if (coreReady) {
                                                  FaceSwapEngine.swapAi(
                                                      context = context,
                                                      sources = srcs,
                                                      target = target,
                                                      strength = strength,
                                                      enhancerAmount = enhance,
                                                      targetFaceIndex = selectedFace,
                                                      swapModel = swapModel,
                                                      enhancer = enhancer,
                                                      preciseMask = preciseMask,
                                                      occlusionMask = occlusionMask,
                                                      colorMatch = colorMatch,
                                                      pixelBoost512 = pixelBoost,
                                                  )
                                              } else {
                                                  val source = FaceSwapEngine.decodeBitmap(context, srcs.first())
                                                  try { FaceSwapEngine.swap(context, source, target, strength, selectedFace) }
                                                  finally { source.recycle() }
                                              }
                                          } finally {
                                              target.recycle()
                                          }
                                      }
                                      result?.recycle(); result = output
                                  } catch (e: OutOfMemoryError) {
                                      FaceSwapEngine.release()
                                      errorMessage = "Not enough memory. Turn off Pixel Boost or close other apps and try again."
                                  } catch (t: Throwable) {
                                      errorMessage = t.message ?: "Face swap failed"
                                  } finally {
                                      running = false
                                  }
                              }
                          },
                          enabled = !running && !downloading && sourceUris.isNotEmpty() &&
                              (targetUri != null || transferredTarget != null) && targetFaces.isNotEmpty(),
                          modifier = Modifier.fillMaxWidth(),
                      ) {
                          if (running) {
                              CircularProgressIndicator(modifier = Modifier.size(20.dp), strokeWidth = 2.dp)
                              Spacer(Modifier.size(8.dp))
                          } else {
                              Icon(Icons.Default.FaceRetouchingNatural, contentDescription = null)
                              Spacer(Modifier.size(8.dp))
                          }
                          Text(if (running) "Creating high-quality swap…" else "Swap selected face")
                      }
          
                      result?.let { bitmap ->
                          Text("Result", style = MaterialTheme.typography.titleMedium)
                          Card(shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()) {
                              Image(
                                  bitmap = bitmap.asImageBitmap(),
                                  contentDescription = "Face swap result",
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .aspectRatio(bitmap.width.toFloat() / bitmap.height.toFloat()),
                                  contentScale = ContentScale.Fit,
                              )
                          }
                          OutlinedButton(
                              onClick = {
                                  scope.launch(Dispatchers.IO) {
                                      try {
                                          FaceSwapEngine.saveToGallery(context, bitmap)
                                          withContext(Dispatchers.Main) {
                                              Toast.makeText(context, "Saved to Pictures/LocalDream", Toast.LENGTH_SHORT).show()
                                          }
                                      } catch (t: Throwable) {
                                          withContext(Dispatchers.Main) { errorMessage = t.message ?: "Could not save image" }
                                      }
                                  }
                              },
                              modifier = Modifier.fillMaxWidth(),
                          ) {
                              Icon(Icons.Default.Save, contentDescription = null)
                              Spacer(Modifier.size(8.dp))
                              Text("Save result")
                          }
                      }
          
                      Spacer(Modifier.height(16.dp))
                      Text(
                          "Quality mode uses XNNPACK acceleration when supported and automatically falls back to optimized CPU execution if a model is incompatible.",
                          style = MaterialTheme.typography.bodySmall,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                      )
                  }
              }
          }
          
          @Composable
          private fun SettingSwitch(
              title: String,
              detail: String,
              checked: Boolean,
              enabled: Boolean,
              onChange: (Boolean) -> Unit,
          ) {
              Row(modifier = Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                  Column(modifier = Modifier.weight(1f)) {
                      Text(title)
                      Text(detail, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                  }
                  Switch(checked = checked, onCheckedChange = onChange, enabled = enabled)
              }
          }
          
          @Composable
          private fun FaceTargetCard(
              bitmap: Bitmap,
              faces: List<FaceCandidate>,
              selectedFace: Int,
              onSelectFace: (Int) -> Unit,
              onChooseImage: () -> Unit,
          ) {
              var canvasSize by remember { mutableStateOf(IntSize.Zero) }
              val selectedColor = MaterialTheme.colorScheme.primary
              val otherColor = MaterialTheme.colorScheme.onSurfaceVariant
              Card(
                  modifier = Modifier
                      .fillMaxWidth()
                      .aspectRatio(bitmap.width.toFloat() / bitmap.height.toFloat()),
              ) {
                  Box(Modifier.fillMaxSize()) {
                      Image(
                          bitmap = bitmap.asImageBitmap(),
                          contentDescription = "Target image",
                          modifier = Modifier.fillMaxSize(),
                          contentScale = ContentScale.FillBounds,
                      )
                      Canvas(
                          modifier = Modifier
                              .fillMaxSize()
                              .onSizeChanged { canvasSize = it }
                              .pointerInput(bitmap, faces, canvasSize) {
                                  detectTapGestures(
                                      onTap = { tap ->
                                          if (canvasSize.width <= 0 || canvasSize.height <= 0 || faces.isEmpty()) {
                                              onChooseImage()
                                          } else {
                                              val bx = tap.x * bitmap.width / canvasSize.width.toFloat()
                                              val by = tap.y * bitmap.height / canvasSize.height.toFloat()
                                              val hit = faces.firstOrNull { bx in it.left..it.right && by in it.top..it.bottom }
                                              if (hit != null) onSelectFace(hit.index) else onChooseImage()
                                          }
                                      },
                                      onLongPress = { onChooseImage() },
                                  )
                              },
                      ) {
                          val sx = size.width / bitmap.width.toFloat()
                          val sy = size.height / bitmap.height.toFloat()
                          faces.forEach { face ->
                              drawRect(
                                  color = if (face.index == selectedFace) selectedColor else otherColor,
                                  topLeft = Offset(face.left * sx, face.top * sy),
                                  size = Size((face.right - face.left) * sx, (face.bottom - face.top) * sy),
                                  style = Stroke(width = if (face.index == selectedFace) 6f else 3f),
                              )
                          }
                      }
                  }
              }
          }
          
