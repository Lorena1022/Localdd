          if "onnxruntime-android" not in s:
              if s.count(a) != 1:
                  raise SystemExit("dependency anchor not found")
              s = s.replace(a, a + deps, 1)
          p = "            useLegacyPackaging = true\n"
          if "libc++_shared.so" not in s:
              if s.count(p) != 1:
