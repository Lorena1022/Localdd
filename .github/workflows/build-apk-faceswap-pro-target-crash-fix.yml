          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("local-dream/app/src/main/java/io/github/xororz/localdream")
          def patch(f, needle, anchor, insert, before=False):
              p = root / f
              s = p.read_text()
              if needle in s:
                  return
              if s.count(anchor) != 1:
                  raise SystemExit(f"Anchor not found in {f}")
              p.write_text(s.replace(anchor, insert + anchor if before else anchor + insert, 1))
          patch("navigation/Navigation.kt", 'object FaceSwap :',
                '    object Upscale : Screen("upscale")\n',
                '\n    object FaceSwap : Screen("face_swap")\n')
          patch("MainActivity.kt", "screens.FaceSwapScreen",
                "import io.github.xororz.localdream.navigation.Screen\n",
                "import io.github.xororz.localdream.ui.screens.FaceSwapScreen\n")
          patch("MainActivity.kt", "Screen.FaceSwap.route",
                "        composable(Screen.History.route) {\n",
                "        composable(Screen.FaceSwap.route) {\n"
                "            FaceSwapScreen(navController)\n"
                "        }\n", before=True)
          i = " " * 28
          patch("ui/screens/ModelListScreen.kt", "Screen.FaceSwap.route",
