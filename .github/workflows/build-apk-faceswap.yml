name: Build Local Dream FaceSwap APK

on:
  workflow_dispatch:

env:
  UPSTREAM_COMMIT: 440899fb6dbd14712b4a1c8fe4d6b0e1c9f68a36
  OFFICIAL_APK_URL: https://github.com/xororz/local-dream/releases/download/v3.0.0-alpha.3/LocalDream_armv8a_3.0.0-alpha.3.apk
  OFFICIAL_APK_SHA256: 706f5067bc7e41ead1d850b52f87feff5669ec3ec429b8cc68c5acbf8801cc4f
  OUT_APK: LocalDream_FaceSwap_3.0.0-alpha.3.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Local Dream
        uses: actions/checkout@v4
        with:
          repository: xororz/local-dream
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: local-dream

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install platform 37 and build-tools
        run: |
          set +e
          SDK="$(command -v sdkmanager)"
          echo "sdkmanager: $SDK"
          yes 2>/dev/null | "$SDK" --licenses > /dev/null
          "$SDK" --list --channel=3 > /tmp/l.txt 2>&1
          # Progress bars use \r; split on it so package ids sit on their own lines.
          tr '\r' '\n' < /tmp/l.txt \
            | awk -F'|' 'NF>=2{gsub(/^[ \t]+|[ \t]+$/,"",$1);print $1}' | sort -u > /tmp/p.txt
          grep -E '^(platforms;android-37|build-tools;37)' /tmp/p.txt
          PKGS=""
          for p in "platforms;android-37.0" "platforms;android-37"; do
            if grep -Fxq "$p" /tmp/p.txt; then PKGS="$p"; break; fi
          done
          BT="$(grep -E '^build-tools;37\.' /tmp/p.txt | sort -V | tail -n1)"
          [ -n "$BT" ] && PKGS="$PKGS $BT"
          if [ -n "$PKGS" ]; then
            echo "Installing:$PKGS"
            yes 2>/dev/null | "$SDK" --channel=3 $PKGS
          else
            echo "::warning::API 37 packages not listed; Gradle will download what it needs."
          fi
          ls -1 "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>/dev/null
          exit 0

      - name: Add FaceSwap code and libraries
        run: |
          set -euo pipefail
          R=local-dream/app/src/main/java/io/github/xororz/localdream
          mkdir -p "$R/faceswap" "$R/ui/screens"
          cat > "$R/faceswap/FaceSwapEngine.kt" <<'KOTLIN_ENGINE_EOF'
          package io.github.xororz.localdream.faceswap

          import ai.onnxruntime.OnnxTensor
          import ai.onnxruntime.OrtEnvironment
          import ai.onnxruntime.OrtSession
          import android.content.ContentValues
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BlurMaskFilter
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.ImageDecoder
          import android.graphics.Matrix
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PointF
          import android.graphics.Rect
          import android.net.Uri
          import android.os.Build
          import android.provider.MediaStore
          import com.google.android.gms.tasks.Tasks
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.face.FaceContour
          import com.google.mlkit.vision.face.FaceDetection
          import com.google.mlkit.vision.face.FaceDetector
          import com.google.mlkit.vision.face.FaceDetectorOptions
          import java.io.File
          import java.io.FileOutputStream
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.URL
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.nio.FloatBuffer
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt
          import kotlin.math.sqrt

          /** The two InsightFace models, downloaded once into app storage. */
          object FaceSwapModels {
              private const val BASE_URL =
                  "https://github.com/facefusion/facefusion-assets/releases/download/models-3.0.0/"
              const val ARCFACE = "arcface_w600k_r50.onnx"
              const val INSWAPPER = "inswapper_128.onnx"
              const val GFPGAN = "gfpgan_1.4.onnx"
              private val sizes = linkedMapOf(
                  ARCFACE to 174_388_474L,
                  INSWAPPER to 555_303_150L,
                  GFPGAN to 340_299_087L,
              )
              val totalBytes: Long = sizes.values.sum()

              private fun dir(context: Context): File = File(context.filesDir, "faceswap_models").apply { mkdirs() }

              fun file(context: Context, name: String): File = File(dir(context), name)

              fun isReady(context: Context): Boolean =
                  sizes.all { (name, size) -> file(context, name).let { it.exists() && it.length() == size } }

              /** Bytes still to download (partial downloads count as done). */
              fun remainingBytes(context: Context): Long = sizes.entries.sumOf { (name, size) ->
                  val f = file(context, name)
                  val part = File(f.path + ".part")
                  when {
                      f.exists() && f.length() == size -> 0L
                      part.exists() -> max(0L, size - part.length())
                      else -> size
                  }
              }

              /** Blocking. Resumes partial downloads. [onProgress] gets 0..1. */
              fun download(context: Context, onProgress: (Float) -> Unit) {
                  var finished = 0L
                  for ((name, size) in sizes) {
                      val out = file(context, name)
                      if (out.exists() && out.length() == size) {
                          finished += size
                          onProgress(finished.toFloat() / totalBytes)
                          continue
                      }
                      val part = File(out.path + ".part")
                      var have = if (part.exists()) part.length() else 0L
                      if (have > size) {
                          part.delete()
                          have = 0L
                      }
                      val conn = (URL(BASE_URL + name).openConnection() as HttpURLConnection).apply {
                          connectTimeout = 30_000
                          readTimeout = 60_000
                          instanceFollowRedirects = true
                          if (have > 0) setRequestProperty("Range", "bytes=$have-")
                      }
                      try {
                          val code = conn.responseCode
                          val append = when (code) {
                              206 -> true
                              200 -> false
                              else -> throw IOException("Download failed for $name (HTTP $code)")
                          }
                          if (!append) have = 0L
                          conn.inputStream.use { input ->
                              FileOutputStream(part, append).use { output ->
                                  val buf = ByteArray(1 shl 20)
                                  var lastReport = 0L
                                  while (true) {
                                      val n = input.read(buf)
                                      if (n < 0) break
                                      output.write(buf, 0, n)
                                      have += n
                                      if (have - lastReport > 4_000_000) {
                                          lastReport = have
                                          onProgress((finished + have).toFloat() / totalBytes)
                                      }
                                  }
                              }
                          }
                      } finally {
                          conn.disconnect()
                      }
                      if (part.length() != size) throw IOException("Download of $name was incomplete. Tap Download to resume.")
                      if (!part.renameTo(out)) throw IOException("Could not save $name")
                      finished += size
                      onProgress(finished.toFloat() / totalBytes)
                  }
              }
          }

          object FaceSwapEngine {
              private const val MAX_DETECT_DIM = 1280

              // ArcFace 112x112 alignment template (eyes, nose tip, mouth corners), image-left first.
              private val ARC_TEMPLATE = floatArrayOf(
                  38.2946f, 51.6963f, 73.5318f, 51.5014f, 56.0252f, 71.7366f, 41.5493f, 92.3655f, 70.7299f, 92.2041f,
              )

              // FFHQ 512x512 alignment template used by GFPGAN.
              private val FFHQ_TEMPLATE = floatArrayOf(
                  0.37691676f, 0.46864664f, 0.62285697f, 0.46912813f, 0.50123859f, 0.61331904f,
                  0.39308822f, 0.72541100f, 0.61150205f, 0.72490465f,
              )

              private class FaceGeom(
                  val leftEye: PointF,
                  val rightEye: PointF,
                  val mouth: PointF,
                  val kps: List<PointF>,
                  val oval: List<PointF>,
                  val left: Float,
                  val top: Float,
                  val right: Float,
                  val bottom: Float,
              )

              private var emap: FloatArray? = null
              private var arcSession: OrtSession? = null
              private var swapSession: OrtSession? = null
              private var gfpganSession: OrtSession? = null

              fun decodeBitmap(context: Context, uri: Uri): Bitmap {
                  val source = ImageDecoder.createSource(context.contentResolver, uri)
                  return ImageDecoder.decodeBitmap(source) { decoder, _, _ ->
                      decoder.allocator = ImageDecoder.ALLOCATOR_SOFTWARE
                      decoder.isMutableRequired = true
                  }.copy(Bitmap.Config.ARGB_8888, true)
              }

              /** Fast swap without AI models: warp + color match + feathered blend. */
              fun swap(source: Bitmap, target: Bitmap, strength: Float = 1f): Bitmap {
                  require(strength in 0f..1f) { "strength must be between 0 and 1" }
                  val (src, dst) = detectBoth(source, target)
                  val region = regionFor(target, dst, 0.25f)
                  val ox = region.left.toFloat()
                  val oy = region.top.toFloat()
                  val matrix = Matrix()
                  val ok = matrix.setPolyToPoly(
                      floatArrayOf(src.leftEye.x, src.leftEye.y, src.rightEye.x, src.rightEye.y, src.mouth.x, src.mouth.y),
                      0,
                      floatArrayOf(
                          dst.leftEye.x - ox, dst.leftEye.y - oy,
                          dst.rightEye.x - ox, dst.rightEye.y - oy,
                          dst.mouth.x - ox, dst.mouth.y - oy,
                      ),
                      0,
                      3,
                  )
                  if (!ok) throw IllegalArgumentException("Could not align the faces.")
                  val warped = Bitmap.createBitmap(region.width(), region.height(), Bitmap.Config.ARGB_8888)
                  Canvas(warped).drawBitmap(source, matrix, Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG))
                  return blend(target, region, warped, dst, 0.92f, 0.07f, strength, colorMatch = true)
              }

              /**
               * InsightFace inswapper: keeps the source identity, re-lit for the target.
               * Several [sources] of the same person are averaged for a steadier likeness.
               * [enhance] (0..1) blends in GFPGAN face restoration for a sharp 512px face.
               */
              fun swapAi(
                  context: Context,
                  sources: List<Uri>,
                  target: Bitmap,
                  strength: Float = 1f,
                  enhance: Float = 0.8f,
              ): Bitmap {
                  require(strength in 0f..1f) { "strength must be between 0 and 1" }
                  require(sources.isNotEmpty()) { "Choose at least one source photo." }
                  if (!FaceSwapModels.isReady(context)) throw IllegalStateException("Download the AI face models first.")
                  val env = OrtEnvironment.getEnvironment()

                  // 1. Average identity embedding over all source photos (ArcFace, 112x112).
                  val embedding = FloatArray(512)
                  var used = 0
                  val dst = withDetector { detector ->
                      for (uri in sources) {
                          val bmp = decodeBitmap(context, uri)
                          try {
                              val g = detect(detector, bmp) ?: continue
                              val e = embed(context, env, bmp, g)
                              for (i in 0 until 512) embedding[i] += e[i]
                              used++
                          } finally {
                              bmp.recycle()
                          }
                      }
                      if (used == 0) throw IllegalArgumentException("No clear face was found in the source photos.")
                      detect(detector, target)
                          ?: throw IllegalArgumentException("No clear face was found in the target image.")
                  }
                  normalize(embedding)

                  // 2. latent = normalize(embedding x emap)
                  val map = emap(context)
                  val latent = FloatArray(512)
                  for (i in 0 until 512) {
                      val e = embedding[i]
                      val row = i * 512
                      for (j in 0 until 512) latent[j] += e * map[row + j]
                  }
                  normalize(latent)

                  // 3. Swap on the aligned 128x128 target face (RGB, 0..1).
                  val toCrop = similarity(dst.kps, ARC_TEMPLATE, 128f / 112f)
                  val tgtCrop = alignedCrop(target, toCrop, 128)
                  val tgtInput = toChw(tgtCrop, 128, 0f, 255f)
                  tgtCrop.recycle()
                  val swapped = FloatArray(3 * 128 * 128)
                  OnnxTensor.createTensor(env, FloatBuffer.wrap(tgtInput), longArrayOf(1, 3, 128, 128)).use { t ->
                      OnnxTensor.createTensor(env, FloatBuffer.wrap(latent), longArrayOf(1, 512)).use { s ->
                          inswapper(context, env).run(mapOf("target" to t, "source" to s)).use { r ->
                              (r.get(0) as OnnxTensor).floatBuffer.get(swapped)
                          }
                      }
                  }

                  // 4. Back to pixels with feathered square edges, then paste into the target.
                  val plane = 128 * 128
                  val px = IntArray(plane)
                  for (y in 0 until 128) {
                      for (x in 0 until 128) {
                          val i = y * 128 + x
                          val edge = min(min(x, y), min(127 - x, 127 - y)).toFloat()
                          val a = ((edge - 3f) / 10f).coerceIn(0f, 1f)
                          px[i] = Color.argb(
                              (a * 255f).roundToInt(),
                              (swapped[i] * 255f).roundToInt().coerceIn(0, 255),
                              (swapped[plane + i] * 255f).roundToInt().coerceIn(0, 255),
                              (swapped[2 * plane + i] * 255f).roundToInt().coerceIn(0, 255),
                          )
                      }
                  }
                  val face = Bitmap.createBitmap(128, 128, Bitmap.Config.ARGB_8888)
                  face.setPixels(px, 0, 128, 0, 0, 128, 128)

                  val region = regionFor(target, dst, 0.5f)
                  val back = Matrix()
                  if (!toCrop.invert(back)) throw IllegalArgumentException("Could not align the faces.")
                  back.postTranslate(-region.left.toFloat(), -region.top.toFloat())
                  val warped = Bitmap.createBitmap(region.width(), region.height(), Bitmap.Config.ARGB_8888)
                  Canvas(warped).drawBitmap(face, back, Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG))
                  face.recycle()
                  val swappedImage = blend(target, region, warped, dst, 1.0f, 0.05f, strength, colorMatch = false)
                  if (enhance <= 0.001f) return swappedImage
                  val restored = restore(context, env, swappedImage, dst, enhance.coerceIn(0f, 1f))
                  swappedImage.recycle()
                  return restored
              }

              private fun embed(context: Context, env: OrtEnvironment, bitmap: Bitmap, face: FaceGeom): FloatArray {
                  val crop = alignedCrop(bitmap, similarity(face.kps, ARC_TEMPLATE, 1f), 112)
                  val input = toChw(crop, 112, 127.5f, 127.5f)
                  crop.recycle()
                  val out = FloatArray(512)
                  OnnxTensor.createTensor(env, FloatBuffer.wrap(input), longArrayOf(1, 3, 112, 112)).use { t ->
                      arcface(context, env).run(mapOf("input" to t)).use { r ->
                          (r.get(0) as OnnxTensor).floatBuffer.get(out)
                      }
                  }
                  normalize(out)
                  return out
              }

              /** GFPGAN 1.4 on the target face (FFHQ 512 alignment), blended back by [amount]. */
              private fun restore(context: Context, env: OrtEnvironment, image: Bitmap, dst: FaceGeom, amount: Float): Bitmap {
                  val toCrop = similarity(dst.kps, FFHQ_TEMPLATE, 512f)
                  val crop = alignedCrop(image, toCrop, 512)
                  val input = toChw(crop, 512, 127.5f, 127.5f)
                  crop.recycle()
                  val plane = 512 * 512
                  val out = FloatArray(3 * plane)
                  OnnxTensor.createTensor(env, FloatBuffer.wrap(input), longArrayOf(1, 3, 512, 512)).use { t ->
                      gfpgan(context, env).run(mapOf("input" to t)).use { r ->
                          (r.get(0) as OnnxTensor).floatBuffer.get(out)
                      }
                  }
                  val px = IntArray(plane)
                  for (y in 0 until 512) {
                      for (x in 0 until 512) {
                          val i = y * 512 + x
                          val edge = min(min(x, y), min(511 - x, 511 - y)).toFloat()
                          val a = ((edge - 24f) / 48f).coerceIn(0f, 1f)
                          fun ch(v: Float) = (((v.coerceIn(-1f, 1f) + 1f) * 0.5f) * 255f).roundToInt().coerceIn(0, 255)
                          px[i] = Color.argb((a * 255f).roundToInt(), ch(out[i]), ch(out[plane + i]), ch(out[2 * plane + i]))
                      }
                  }
                  val face = Bitmap.createBitmap(512, 512, Bitmap.Config.ARGB_8888)
                  face.setPixels(px, 0, 512, 0, 0, 512, 512)

                  val region = regionFor(image, dst, 0.6f)
                  val back = Matrix()
                  if (!toCrop.invert(back)) return image.copy(Bitmap.Config.ARGB_8888, true)
                  back.postTranslate(-region.left.toFloat(), -region.top.toFloat())
                  val warped = Bitmap.createBitmap(region.width(), region.height(), Bitmap.Config.ARGB_8888)
                  Canvas(warped).drawBitmap(face, back, Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG))
                  face.recycle()

                  val w = region.width()
                  val h = region.height()
                  val wp = IntArray(w * h)
                  val tp = IntArray(w * h)
                  warped.getPixels(wp, 0, w, 0, 0, w, h)
                  image.getPixels(tp, 0, w, region.left, region.top, w, h)
                  warped.recycle()
                  for (i in tp.indices) {
                      val a = Color.alpha(wp[i]) / 255f * amount
                      if (a <= 0.001f) continue
                      val s = wp[i]
                      val t = tp[i]
                      tp[i] = Color.argb(
                          Color.alpha(t),
                          (Color.red(t) * (1f - a) + Color.red(s) * a).roundToInt().coerceIn(0, 255),
                          (Color.green(t) * (1f - a) + Color.green(s) * a).roundToInt().coerceIn(0, 255),
                          (Color.blue(t) * (1f - a) + Color.blue(s) * a).roundToInt().coerceIn(0, 255),
                      )
                  }
                  val result = image.copy(Bitmap.Config.ARGB_8888, true)
                  result.setPixels(tp, 0, w, region.left, region.top, w, h)
                  return result
              }

              /** Frees the ~1 GB of model memory. */
              fun release() {
                  arcSession?.close()
                  swapSession?.close()
                  gfpganSession?.close()
                  arcSession = null
                  swapSession = null
                  gfpganSession = null
              }

              fun saveToGallery(context: Context, bitmap: Bitmap): Uri {
                  val name = "LocalDream_faceswap_${System.currentTimeMillis()}.jpg"
                  val values = ContentValues().apply {
                      put(MediaStore.Images.Media.DISPLAY_NAME, name)
                      put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/LocalDream")
                      }
                  }
                  val uri = context.contentResolver.insert(
                      MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                      values,
                  ) ?: throw IOException("Unable to create gallery item")
                  try {
                      context.contentResolver.openOutputStream(uri)?.use { output ->
                          if (!bitmap.compress(Bitmap.CompressFormat.JPEG, 96, output)) {
                              throw IOException("Unable to encode image")
                          }
                      } ?: throw IOException("Unable to open gallery output stream")
                  } catch (t: Throwable) {
                      context.contentResolver.delete(uri, null, null)
                      throw t
                  }
                  return uri
              }

              @Synchronized
              private fun arcface(context: Context, env: OrtEnvironment): OrtSession =
                  arcSession ?: env.createSession(
                      FaceSwapModels.file(context, FaceSwapModels.ARCFACE).path,
                      sessionOptions(),
                  ).also { arcSession = it }

              @Synchronized
              private fun inswapper(context: Context, env: OrtEnvironment): OrtSession =
                  swapSession ?: env.createSession(
                      FaceSwapModels.file(context, FaceSwapModels.INSWAPPER).path,
                      sessionOptions(),
                  ).also { swapSession = it }

              @Synchronized
              private fun gfpgan(context: Context, env: OrtEnvironment): OrtSession =
                  gfpganSession ?: env.createSession(
                      FaceSwapModels.file(context, FaceSwapModels.GFPGAN).path,
                      sessionOptions(),
                  ).also { gfpganSession = it }

              private fun sessionOptions(): OrtSession.SessionOptions = OrtSession.SessionOptions().apply {
                  setIntraOpNumThreads(max(1, min(4, Runtime.getRuntime().availableProcessors())))
              }

              @Synchronized
              private fun emap(context: Context): FloatArray = emap ?: run {
                  val bytes = context.assets.open("faceswap/emap.bin").use { it.readBytes() }
                  if (bytes.size != 512 * 512 * 4) throw IOException("emap.bin is damaged")
                  val out = FloatArray(512 * 512)
                  ByteBuffer.wrap(bytes).order(ByteOrder.LITTLE_ENDIAN).asFloatBuffer().get(out)
                  out
              }.also { emap = it }

              private fun normalize(v: FloatArray) {
                  var sum = 0.0
                  for (x in v) sum += (x * x).toDouble()
                  val n = sqrt(sum).toFloat()
                  if (n > 0f) for (i in v.indices) v[i] /= n
              }

              /** Least-squares similarity transform mapping [pts] onto [template] * [scale]. */
              private fun similarity(pts: List<PointF>, template: FloatArray, scale: Float): Matrix {
                  val n = pts.size
                  var psx = 0f
                  var psy = 0f
                  var qsx = 0f
                  var qsy = 0f
                  for (i in 0 until n) {
                      psx += pts[i].x
                      psy += pts[i].y
                      qsx += template[2 * i] * scale
                      qsy += template[2 * i + 1] * scale
                  }
                  psx /= n
                  psy /= n
                  qsx /= n
                  qsy /= n
                  var varP = 0f
                  var a = 0f
                  var b = 0f
                  for (i in 0 until n) {
                      val px = pts[i].x - psx
                      val py = pts[i].y - psy
                      val qx = template[2 * i] * scale - qsx
                      val qy = template[2 * i + 1] * scale - qsy
                      varP += px * px + py * py
                      a += px * qx + py * qy
                      b += px * qy - py * qx
                  }
                  a /= varP
                  b /= varP
                  val tx = qsx - (a * psx - b * psy)
                  val ty = qsy - (b * psx + a * psy)
                  return Matrix().apply { setValues(floatArrayOf(a, -b, tx, b, a, ty, 0f, 0f, 1f)) }
              }

              private fun alignedCrop(bitmap: Bitmap, m: Matrix, size: Int): Bitmap {
                  val out = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                  Canvas(out).drawBitmap(bitmap, m, Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG))
                  return out
              }

              private fun toChw(bitmap: Bitmap, size: Int, mean: Float, std: Float): FloatArray {
                  val plane = size * size
                  val px = IntArray(plane)
                  bitmap.getPixels(px, 0, size, 0, 0, size, size)
                  val out = FloatArray(3 * plane)
                  for (i in 0 until plane) {
                      val c = px[i]
                      out[i] = (Color.red(c) - mean) / std
                      out[plane + i] = (Color.green(c) - mean) / std
                      out[2 * plane + i] = (Color.blue(c) - mean) / std
                  }
                  return out
              }

              private inline fun <T> withDetector(block: (FaceDetector) -> T): T {
                  val options = FaceDetectorOptions.Builder()
                      .setPerformanceMode(FaceDetectorOptions.PERFORMANCE_MODE_ACCURATE)
                      .setContourMode(FaceDetectorOptions.CONTOUR_MODE_ALL)
                      .setMinFaceSize(0.05f)
                      .build()
                  val detector = FaceDetection.getClient(options)
                  try {
                      return block(detector)
                  } finally {
                      detector.close()
                  }
              }

              private fun detectBoth(source: Bitmap, target: Bitmap): Pair<FaceGeom, FaceGeom> = withDetector { detector ->
                  val src = detect(detector, source)
                      ?: throw IllegalArgumentException("No clear face was found in the source image.")
                  val dst = detect(detector, target)
                      ?: throw IllegalArgumentException("No clear face was found in the target image.")
                  src to dst
              }

              private fun detect(detector: FaceDetector, bitmap: Bitmap): FaceGeom? {
                  val maxDim = max(bitmap.width, bitmap.height)
                  val scale = if (maxDim > MAX_DETECT_DIM) MAX_DETECT_DIM.toFloat() / maxDim else 1f
                  val input = if (scale < 1f) {
                      Bitmap.createScaledBitmap(
                          bitmap,
                          max(1, (bitmap.width * scale).roundToInt()),
                          max(1, (bitmap.height * scale).roundToInt()),
                          true,
                      )
                  } else {
                      bitmap
                  }
                  val faces = try {
                      Tasks.await(detector.process(InputImage.fromBitmap(input, 0)))
                  } finally {
                      if (input !== bitmap) input.recycle()
                  }
                  val face = faces
                      .filter { it.getContour(FaceContour.FACE) != null }
                      .maxByOrNull { it.boundingBox.width() * it.boundingBox.height() }
                      ?: return null

                  val inv = 1f / scale
                  fun pts(type: Int): List<PointF> =
                      face.getContour(type)?.points?.map { PointF(it.x * inv, it.y * inv) } ?: emptyList()

                  val oval = pts(FaceContour.FACE)
                  val eyeA = pts(FaceContour.LEFT_EYE)
                  val eyeB = pts(FaceContour.RIGHT_EYE)
                  val lipTop = pts(FaceContour.UPPER_LIP_TOP)
                  val lipBottom = pts(FaceContour.LOWER_LIP_BOTTOM)
                  val bridge = pts(FaceContour.NOSE_BRIDGE)
                  val noseBottom = pts(FaceContour.NOSE_BOTTOM)
                  if (oval.size < 10 || eyeA.isEmpty() || eyeB.isEmpty() || lipTop.size < 2) return null
                  val nose = bridge.lastOrNull() ?: noseBottom.getOrNull(noseBottom.size / 2) ?: return null

                  // Image-left first, matching the ArcFace template.
                  val eyes = listOf(center(eyeA), center(eyeB)).sortedBy { it.x }
                  val corners = listOf(lipTop.first(), lipTop.last()).sortedBy { it.x }
                  return FaceGeom(
                      leftEye = eyes[0],
                      rightEye = eyes[1],
                      mouth = center(lipTop + lipBottom),
                      kps = listOf(eyes[0], eyes[1], nose, corners[0], corners[1]),
                      oval = oval,
                      left = oval.minOf { it.x },
                      top = oval.minOf { it.y },
                      right = oval.maxOf { it.x },
                      bottom = oval.maxOf { it.y },
                  )
              }

              private fun center(points: List<PointF>): PointF {
                  var x = 0f
                  var y = 0f
                  for (p in points) {
                      x += p.x
                      y += p.y
                  }
                  return PointF(x / points.size, y / points.size)
              }

              private fun regionFor(target: Bitmap, dst: FaceGeom, padFraction: Float): Rect {
                  val pad = max(dst.right - dst.left, dst.bottom - dst.top) * padFraction
                  val r = Rect(
                      (dst.left - pad).toInt().coerceIn(0, target.width - 1),
                      (dst.top - pad).toInt().coerceIn(0, target.height - 1),
                      (dst.right + pad).roundToInt().coerceIn(1, target.width),
                      (dst.bottom + pad).roundToInt().coerceIn(1, target.height),
                  )
                  if (r.width() < 4 || r.height() < 4) throw IllegalArgumentException("The target face is too small.")
                  return r
              }

              /** Blends [warped] (region-sized) into [target] inside the feathered target face oval. */
              private fun blend(
                  target: Bitmap,
                  region: Rect,
                  warped: Bitmap,
                  dst: FaceGeom,
                  ovalScale: Float,
                  featherFraction: Float,
                  strength: Float,
                  colorMatch: Boolean,
              ): Bitmap {
                  val w = region.width()
                  val h = region.height()
                  val ox = region.left.toFloat()
                  val oy = region.top.toFloat()
                  val c = center(dst.oval)
                  val path = Path()
                  dst.oval.forEachIndexed { i, p ->
                      val x = c.x + (p.x - c.x) * ovalScale - ox
                      val y = c.y + (p.y - c.y) * ovalScale - oy
                      if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
                  }
                  path.close()
                  val feather = max(2f, min(dst.right - dst.left, dst.bottom - dst.top) * featherFraction)
                  val mask = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  Canvas(mask).drawPath(
                      path,
                      Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = Color.WHITE
                          maskFilter = BlurMaskFilter(feather, BlurMaskFilter.Blur.NORMAL)
                      },
                  )

                  val n = w * h
                  val wp = IntArray(n)
                  val mp = IntArray(n)
                  val tp = IntArray(n)
                  warped.getPixels(wp, 0, w, 0, 0, w, h)
                  mask.getPixels(mp, 0, w, 0, 0, w, h)
                  target.getPixels(tp, 0, w, region.left, region.top, w, h)
                  warped.recycle()
                  mask.recycle()

                  val gain = FloatArray(3) { 1f }
                  val sMean = FloatArray(3)
                  val tMean = FloatArray(3)
                  if (colorMatch) {
                      val sSum = DoubleArray(3)
                      val sSq = DoubleArray(3)
                      val tSum = DoubleArray(3)
                      val tSq = DoubleArray(3)
                      var count = 0
                      for (i in 0 until n) {
                          if (Color.alpha(mp[i]) < 220 || Color.alpha(wp[i]) < 250) continue
                          val s = wp[i]
                          val t = tp[i]
                          val sv = intArrayOf(Color.red(s), Color.green(s), Color.blue(s))
                          val tv = intArrayOf(Color.red(t), Color.green(t), Color.blue(t))
                          for (k in 0..2) {
                              sSum[k] += sv[k].toDouble()
                              sSq[k] += (sv[k] * sv[k]).toDouble()
                              tSum[k] += tv[k].toDouble()
                              tSq[k] += (tv[k] * tv[k]).toDouble()
                          }
                          count++
                      }
                      if (count > 50) {
                          for (k in 0..2) {
                              sMean[k] = (sSum[k] / count).toFloat()
                              tMean[k] = (tSum[k] / count).toFloat()
                              val sStd = sqrt(max(1.0, sSq[k] / count - sMean[k] * sMean[k].toDouble())).toFloat()
                              val tStd = sqrt(max(1.0, tSq[k] / count - tMean[k] * tMean[k].toDouble())).toFloat()
                              gain[k] = (tStd / sStd).coerceIn(0.6f, 1.6f)
                          }
                      }
                  }

                  val out = IntArray(n)
                  for (i in 0 until n) {
                      val t = tp[i]
                      val a = (Color.alpha(mp[i]) / 255f) * (Color.alpha(wp[i]) / 255f) * strength
                      if (a <= 0.001f) {
                          out[i] = t
                          continue
                      }
                      val s = wp[i]
                      val sr = (Color.red(s) - sMean[0]) * gain[0] + tMean[0]
                      val sg = (Color.green(s) - sMean[1]) * gain[1] + tMean[1]
                      val sb = (Color.blue(s) - sMean[2]) * gain[2] + tMean[2]
                      val r = (Color.red(t) * (1f - a) + sr * a).roundToInt().coerceIn(0, 255)
                      val g = (Color.green(t) * (1f - a) + sg * a).roundToInt().coerceIn(0, 255)
                      val b = (Color.blue(t) * (1f - a) + sb * a).roundToInt().coerceIn(0, 255)
                      out[i] = Color.argb(Color.alpha(t), r, g, b)
                  }

                  val result = target.copy(Bitmap.Config.ARGB_8888, true)
                  result.setPixels(out, 0, w, region.left, region.top, w, h)
                  return result
              }
          }

          /** In-memory handoff so a generated/history image can open directly in Face Swap. */
          object FaceSwapTransfer {
              var targetBitmap: Bitmap? = null
          }
